[project]
name = "translated-news"
version = "0.1.0"
description = "Israeli news headlines with automatic translation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
